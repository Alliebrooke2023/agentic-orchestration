<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Jarvis Hands</title>
<style>
:root{--c:#3df2ff;--w:#ffb547;--bg:#02070c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--c);font:13px/1.4 ui-monospace,Consolas,monospace;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.18;filter:grayscale(1) contrast(1.3)}
canvas{position:fixed;inset:0}
#hud{position:fixed;left:16px;top:14px;max-width:min(420px,calc(100vw - 32px));text-shadow:0 0 6px var(--c)}
#g{font-size:28px;letter-spacing:.08em;text-transform:uppercase}
#bar{height:3px;background:#0d3940;margin:6px 0;width:220px}#bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 8px var(--c)}
#map div{opacity:.75}#log{position:fixed;left:16px;right:16px;bottom:14px;max-height:34vh;overflow:auto;white-space:pre-wrap;color:#bfefff;text-shadow:none}
#log b{color:var(--w)}#err{color:var(--w)}
#ctl{position:fixed;right:16px;top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
select{font:inherit;color:var(--c);background:#04161d;border:1px solid #2a4a52;padding:7px;max-width:200px}
button{font:inherit;color:var(--c);background:#04161d;border:1px solid var(--c);padding:8px 14px;cursor:pointer}
#lamp{padding:4px 10px;border:1px solid #2a4a52;color:#5d8790}#lamp.on{background:#ff3b3b;color:#fff;border-color:#ff3b3b;box-shadow:0 0 14px #ff3b3b}
#ask{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#04161dee;border:1px solid var(--w);color:var(--w);padding:12px 16px;display:none;text-align:center;max-width:calc(100vw - 32px)}
#ask.on{display:block}
</style></head><body>
<video id="v" playsinline muted></video><canvas id="c"></canvas>
<div id="hud"><div>J.A.R.V.I.S // HAND LINK</div><div id="g">booting</div><div id="bar"><i></i></div>
<div id="map"></div><div id="err"></div></div><div id="log"></div>
<div id="ctl"><select id="cam" title="camera"></select><span id="lamp">CAMERA OFF</span><button id="vis">Vision ON</button></div>
<div id="ask"><div id="askq"></div><div>thumbs-up = YES · open palm = NO</div><button id="yes">YES</button> <button id="no">NO</button></div>
<script type="module" src="hand.js"></script></body></html>
