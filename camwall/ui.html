<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CamWall</title>
<style>
body{margin:0;background:#0b0e14;color:#dde;font:14px system-ui}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#151a24;position:sticky;top:0;z-index:2}
button,select,input{background:#222a3a;color:#dde;border:1px solid #3a4560;border-radius:6px;padding:7px 10px}
button.rec{background:#a22}
#grid{display:grid;gap:6px;padding:6px}
.tile{position:relative;background:#000;border-radius:8px;overflow:hidden;border:2px solid #222}
.tile.on{border-color:#e33}
.tile img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain}
.cap{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:4px 8px;background:#000a}
.ctl{position:absolute;bottom:4px;right:4px;display:flex;gap:4px}
.ctl button{padding:4px 8px}
#disc{padding:8px;white-space:pre-wrap;font-size:12px}
</style></head><body>
<div id="bar">
<select id="lay"><option value="1">1x1</option><option value="2" selected>2x2</option><option value="3">3x3</option><option value="4">4x4</option></select>
<button id="ra" class="rec">● Record ALL</button><button id="sa">■ Stop ALL</button>
<button id="ds">Discover</button>
<input id="nm" placeholder="name e.g. Cortex cam" size="14"><input id="url" placeholder="rtsp://… | http://… | 0" size="22"><button id="ad">Add</button>
</div>
<div id="disc"></div><div id="grid"></div>
<script>
const T="__T__",q=p=>p+(T?(p.includes("?")?"&":"?")+"t="+T:"");
const H={"X-Token":T,"Content-Type":"application/json"};
const $=i=>document.getElementById(i);
const post=(u,b)=>fetch(u,{method:"POST",headers:H,body:b&&JSON.stringify(b)}).then(r=>r.json());
let built="";
async function load(){
 const c=await fetch(q("/api/cams"),{headers:H}).then(r=>r.json());
 const key=c.map(x=>x.id).join();
 if(key!==built){built=key;$("grid").innerHTML=c.map(x=>`<div class=tile id=t${x.id}><img src="${q("/stream/"+x.id)}"><div class=cap><b>${x.name}</b><span id=s${x.id}></span></div><div class=ctl><button onclick="post('${q("/api/snap/"+x.id)}')">📷</button><button id=b${x.id}></button></div></div>`).join("")}
 c.forEach(x=>{$("s"+x.id).textContent=(x.ok?x.fps+" fps":"NO SIGNAL")+(x.rec?"  ● REC":"");
  $("t"+x.id).classList.toggle("on",x.rec);const b=$("b"+x.id);b.textContent=x.rec?"■":"●";
  b.onclick=()=>post(q(`/api/rec/${x.id}/${x.rec?"stop":"start"}`)).then(load)});
}
function lay(){const n=+$("lay").value;$("grid").style.gridTemplateColumns=`repeat(${n},1fr)`}
$("lay").onchange=lay;lay();
$("ra").onclick=()=>post(q("/api/rec/all/start")).then(load);
$("sa").onclick=()=>post(q("/api/rec/all/stop")).then(load);
$("ad").onclick=()=>post(q("/api/add"),{name:$("nm").value||"Cam",src:$("url").value,kind:"url"}).then(load);
$("ds").onclick=async()=>{$("disc").textContent="Scanning USB/DVI, ONVIF, Bluetooth…";
 const d=await fetch(q("/api/discover"),{headers:H}).then(r=>r.json());
 $("disc").textContent=Object.entries(d).map(([k,v])=>k+": "+(v.length?v.map(x=>x.name+" ["+x.src+"]").join(" | "):"none")).join("\n")};
setInterval(load,1500);load();
</script></body></html>
