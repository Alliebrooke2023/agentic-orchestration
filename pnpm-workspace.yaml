packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@next/env@16.4.6"
  - "@next/eslint-plugin-next@16.4.6"
  - "@next/swc-darwin-arm64@16.4.6"
  - "@next/swc-darwin-x64@16.4.6"
  - "@next/swc-linux-arm64-gnu@16.4.6"
  - "@next/swc-linux-arm64-musl@16.4.6"
  - "@next/swc-linux-x64-gnu@16.4.6"
  - "@next/swc-linux-x64-musl@16.4.6"
  - "@next/swc-win32-arm64-msvc@16.4.6"
  - "@next/swc-win32-x64-msvc@16.4.6"
  - eslint-config-next@16.4.6
  - next@16.4.6

# Security: force patched versions of transitive deps (see pnpm audit)
overrides:
  postcss: ">=8.5.23"
  ws: ">=8.21.0"
  zod: ">=4.6.6"
  nanoid: ">=3.3.18"
  source-map-js: ">=1.2.2"
  browserslist: ">=4.28.7"
  baseline-browser-mapping: ">=2.11.0"
  "@babel/core": ">=7.29.1"
  # Lint only: 7.1.1 flags existing refs-in-render code (use-builder-history.ts). Unpin after fixing it.
  eslint-plugin-react-hooks: "7.0.1"
