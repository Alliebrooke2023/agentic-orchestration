name: Jarvis

on:
  push:
    branches: [main]
    paths: ["jarvis/**", ".github/workflows/jarvis.yml"]
  pull_request:
    paths: ["jarvis/**", ".github/workflows/jarvis.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/gestures.test.mjs
